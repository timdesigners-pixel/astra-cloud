<!doctype html><html><head><meta charset=utf8>
<script src="../_ortak/kopru.js"></script><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pinterest Panolarım</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16;--bg2:#0c1324;--panel:rgba(20,28,48,.62);--solid:#111a2e;--line:rgba(140,170,220,.14);
  --ink:#e8edf7;--mute:#8793ad;--gold:#e3b64f;--cyan:#4fd8e8;--chip:rgba(79,216,232,.08);--rec:#ff5c5c;--ok:#5fd39a;
  --glow:radial-gradient(1200px 600px at 85% -10%,rgba(79,216,232,.10),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(227,182,79,.09),transparent 60%);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f5fa;--bg2:#e8ecf5;--panel:rgba(255,255,255,.8);--solid:#ffffff;--line:rgba(20,40,80,.12);--ink:#0e1628;--mute:#5a6781;
  --gold:#a8791a;--cyan:#0b8c9c;--chip:rgba(11,140,156,.08);--rec:#d23a3a;--ok:#1f8a57;
  --glow:radial-gradient(1200px 600px at 85% -10%,rgba(11,140,156,.08),transparent 60%);color-scheme:light;}}
:root[data-theme="light"]{--bg:#f3f5fa;--bg2:#e8ecf5;--panel:rgba(255,255,255,.8);--solid:#ffffff;--line:rgba(20,40,80,.12);--ink:#0e1628;--mute:#5a6781;--gold:#a8791a;--cyan:#0b8c9c;--chip:rgba(11,140,156,.08);--rec:#d23a3a;--ok:#1f8a57;--glow:none;color-scheme:light}
:root[data-theme="dark"]{--bg:#070b16;--bg2:#0c1324;--panel:rgba(20,28,48,.62);--solid:#111a2e;--line:rgba(140,170,220,.14);--ink:#e8edf7;--mute:#8793ad;--gold:#e3b64f;--cyan:#4fd8e8;--chip:rgba(79,216,232,.08);--rec:#ff5c5c;--ok:#5fd39a;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--glow);background-attachment:fixed;color:var(--ink);
  font:15px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 90px}
.btn{font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:var(--gold);color:#10131c;border-color:var(--gold)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.on{border-color:var(--cyan);color:var(--cyan)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:16px;height:16px;flex:none}
[hidden]{display:none!important}

/* HERO */
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:clamp(440px,62vh,600px);display:flex;align-items:flex-end;background:var(--bg2)}
.hero .bd{position:absolute;inset:0;z-index:-2}
.hero .bd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;opacity:0;transition:opacity .7s ease,transform 8s ease-out;transform:scale(1.04)}
.hero .bd img.in{opacity:1;transform:scale(1)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:
   linear-gradient(90deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 88%,transparent) 26%,color-mix(in srgb,var(--bg) 35%,transparent) 55%,transparent 75%),
   linear-gradient(0deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 80%,transparent) 16%,color-mix(in srgb,var(--bg) 30%,transparent) 42%,transparent 62%),
   linear-gradient(180deg,color-mix(in srgb,var(--bg) 70%,transparent) 0%,transparent 22%)}
.hin{width:100%;max-width:1240px;margin:0 auto;padding:90px 20px 34px;display:grid;gap:14px}
.hin>*{max-width:600px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;gap:10px;flex-wrap:wrap}
.eyebrow b{color:var(--cyan);font-weight:500}
.htitle{margin:0;font-weight:800;font-size:clamp(40px,7.4vw,86px);line-height:.92;letter-spacing:-.045em;text-wrap:balance;text-shadow:0 2px 30px color-mix(in srgb,var(--bg) 60%,transparent)}
.hmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:13px;color:var(--ink)}
.hmeta span{display:inline-flex;gap:6px;align-items:center}
.hmeta .m{color:var(--mute)}
.hmeta .g{color:var(--ok)}
.hdesc{margin:0;color:color-mix(in srgb,var(--ink) 82%,var(--mute));font-size:16.5px;line-height:1.5;text-wrap:pretty}
.hbar{height:4px;border-radius:4px;background:color-mix(in srgb,var(--ink) 18%,transparent);overflow:hidden;max-width:320px}
.hbar i{display:block;height:100%;background:var(--rec)}
.hcta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hcta .btn{padding:11px 20px;font-size:15px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hcta .play{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hcta .play:hover{filter:brightness(.92)}
.hfeat{font-size:13px;color:var(--mute)}
.hfeat a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.hfeat a:hover{color:var(--cyan)}
.hin>.anim{animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.topbar{position:absolute;top:0;left:0;right:0;z-index:3;max-width:1240px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.brand{font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.brand b{color:var(--gold);font-weight:500}
.tb-acts{display:flex;gap:8px;flex-wrap:wrap}

/* PANOLAR */
.sec{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:26px 0 10px}
.sec h2{margin:0;font-size:22px;letter-spacing:-.02em}
.sec small{font-family:var(--mono);font-size:12px;color:var(--mute)}
.grp{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px;display:flex;gap:10px;align-items:baseline}
.grp i{font-style:normal;color:var(--gold)}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.board{all:unset;cursor:pointer;position:relative;overflow:hidden;isolation:isolate;padding:12px 14px;min-height:92px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:grid;align-content:end;gap:1px;transition:border-color .2s,transform .2s}
.board .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;opacity:.55;transition:opacity .25s}
.board::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--solid) 12%,color-mix(in srgb,var(--solid) 70%,transparent) 55%,color-mix(in srgb,var(--solid) 30%,transparent))}
.board:hover{border-color:color-mix(in srgb,var(--cyan) 55%,var(--line));transform:translateY(-2px)}
.board:hover .bg{opacity:.8}
.board b{font-size:22px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.board span{font-size:14px;line-height:1.25;font-weight:600}
.board small{color:var(--mute);font-family:var(--mono);font-size:11px}
.board[aria-pressed="true"]{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}
.board[aria-pressed="true"] b{color:var(--cyan)}
.board:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* BÖLÜMLER başlığı + süzgeç çubuğu */
.eph{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:34px 0 12px}
.eph h2{margin:0;font-size:26px;letter-spacing:-.03em}
.season{font:inherit;font-weight:600;font-size:15px;color:var(--ink);background:var(--solid);border:1px solid var(--line);border-radius:8px;padding:8px 34px 8px 12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;margin:0 -10px 12px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:14px}
input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
select option{background:var(--bg);color:var(--ink)}
input[type=search]{flex:1 1 220px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{font:inherit;font-size:13px;font-weight:600;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{color:var(--bg);background:var(--cyan);border-color:var(--cyan)}
.fchip small{font-family:var(--mono);font-size:11px;opacity:.8}
.shown{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--mute)}

/* KARTLAR */
ol.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));grid-auto-flow:dense;gap:14px}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;cursor:pointer;transition:border-color .2s,box-shadow .2s;position:relative;min-width:0}
.card:hover{border-color:color-mix(in srgb,var(--cyan) 45%,var(--line))}
.ph{position:relative;display:block;background:var(--chip);aspect-ratio:16/9;max-width:100%;overflow:hidden}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph .sk{position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,color-mix(in srgb,var(--ink) 7%,transparent) 50%,transparent 80%) var(--chip);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.ph .pr{position:absolute;left:0;bottom:0;height:4px;background:var(--rec)}
.ph .dur{position:absolute;right:7px;bottom:9px;font:500 11px/1 var(--mono);padding:4px 6px;border-radius:5px;background:rgba(5,8,16,.82);color:#fff}
.ph .ep{position:absolute;left:7px;top:7px;font:500 11px/1 var(--mono);padding:4px 6px;border-radius:5px;background:rgba(5,8,16,.82);color:#fff}
.ph .flags{position:absolute;right:7px;top:7px;display:flex;gap:4px}
.ph .flags span{font:600 10.5px/1 var(--mono);padding:4px 6px;border-radius:5px;background:rgba(5,8,16,.82);color:#fff}
.ph .flags .fav{color:#ff7a90}
.ph .flags .q{color:var(--gold)}
.ph .flags .rh{color:#7ee3ef}
.ph .done{position:absolute;inset:0;background:rgba(5,8,16,.35)}
.body{padding:10px 12px 12px;display:grid;gap:5px;align-content:start;flex:1}
.t{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ch{font-family:var(--mono);font-size:11.5px;color:var(--gold);overflow-wrap:anywhere;display:flex;gap:6px;flex-wrap:wrap}
.ch .m{color:var(--mute)}
.d{color:var(--mute);font-size:13px;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:4px}
.tag{padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--cyan);font-size:12px}
.tag.new{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.ibtn{margin-left:auto;font:inherit;font-size:12px;font-weight:600;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 8px;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.ibtn:hover{color:var(--cyan);border-color:var(--cyan)}

/* Açılan kart (3/4 genişlik) */
.card.open{cursor:default;flex-direction:row;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 18px 50px rgba(0,0,0,.35);background:var(--solid);animation:pop .28s ease}
@keyframes pop{from{opacity:.6;transform:scale(.985)}to{opacity:1;transform:none}}
.card.open .ph{flex:0 0 44%;aspect-ratio:auto;min-height:100%}
.card.open .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 55%,var(--solid))}
.card.open>.body{display:none}
.xp{flex:1;min-width:0;padding:16px 18px 16px 8px;display:grid;gap:8px;align-content:start}
.xp h3{margin:0;font-size:19px;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.xp .row{display:flex;gap:6px 12px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--mute)}
.xp .row b{color:var(--ink);font-weight:500}
.xp p{margin:0;color:color-mix(in srgb,var(--ink) 80%,var(--mute));font-size:14px;line-height:1.45}
.xp .arac{font-size:13px;color:var(--mute)}
.xp .arac b{color:var(--gold);font-weight:600}
.xp .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.xp .acts .btn{padding:7px 12px;font-size:13px}
.xp .close{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center}
.pbar{height:4px;border-radius:4px;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden;max-width:260px}
.pbar i{display:block;height:100%;background:var(--rec)}
.more{display:block;margin:26px auto 0;font:inherit;font-weight:600;color:#10131c;background:var(--gold);border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
.empty{grid-column:1/-1;padding:40px 0;color:var(--mute);text-align:center}

/* seçim modu */
.selecting .card{position:relative}
.selecting .card::after{content:"";position:absolute;top:9px;left:9px;width:22px;height:22px;border-radius:7px;border:2px solid #fff;background:rgba(0,0,0,.35);z-index:2}
.selecting .card.sel{box-shadow:0 0 0 2px var(--cyan)}
.selecting .card.sel::after{background:var(--cyan);border-color:var(--cyan);content:"✓";color:var(--bg);font-weight:800;font-size:14px;display:grid;place-items:center}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);width:max-content;max-width:calc(100% - 24px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.selbar span{font-family:var(--mono);font-size:13px;color:var(--gold);padding:0 6px}

/* dialoglar */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);padding:0;max-width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.mv{padding:24px;width:440px}
.mv h2{margin:0 0 6px;font-size:22px}
.mv p{margin:0 0 14px;color:var(--mute)}
.blist{display:grid;gap:6px;max-height:46vh;overflow:auto;margin:6px 0 14px;padding-right:4px}
.blist label{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px}
.blist label:has(input:checked){border-color:var(--cyan)}
.blist input{accent-color:var(--cyan);margin-right:8px}
.blist small{font-family:var(--mono);color:var(--mute)}
.newb{display:grid;gap:6px;font-size:14px;color:var(--mute)}
.newb input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.acts2{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}

/* Detay modalı */
.dm{width:min(960px,calc(100% - 24px));max-height:calc(100dvh - 32px);overflow:hidden;display:none;flex-direction:column}
.dm[open]{display:flex}
.dhead{position:relative;isolation:isolate;min-height:210px;display:flex;align-items:flex-end;padding:20px 24px 16px;background:var(--bg2);flex:none}
.dhead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.dhead::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,var(--bg) 4%,color-mix(in srgb,var(--bg) 70%,transparent) 45%,color-mix(in srgb,var(--bg) 20%,transparent)),linear-gradient(90deg,color-mix(in srgb,var(--bg) 70%,transparent),transparent 70%)}
.dhead h2{margin:0 0 6px;font-size:clamp(20px,3vw,28px);line-height:1.15;letter-spacing:-.02em;text-wrap:balance;max-width:720px}
.dhead .row{display:flex;gap:6px 12px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--mute)}
.dhead .row b{color:var(--gold);font-weight:500}
.dx{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.tab{font:inherit;font-size:14px;font-weight:600;color:var(--mute);background:none;border:0;border-bottom:2px solid transparent;padding:12px 10px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab small{font-family:var(--mono);font-size:11px;color:var(--mute)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.tab[disabled]{opacity:.38;cursor:default}
.dbody{overflow:auto;padding:20px 24px 26px;flex:1;min-height:200px}
.dbody h4{margin:18px 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:500}
.dbody h4:first-child{margin-top:0}
.dbody p,.dbody li{line-height:1.6;max-width:72ch}
.dbody ol,.dbody ul{padding-left:22px;margin:6px 0}
.lede{font-size:17px;line-height:1.55;margin:0 0 6px;max-width:68ch}
.frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}
.frames img{width:100%;border-radius:10px;display:block;border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--mute);font-family:var(--mono);font-size:12px;padding-top:2px}
.kv dd{margin:0}
.tscr{display:grid;gap:10px}
.tscr div{display:grid;grid-template-columns:62px 1fr;gap:12px;line-height:1.6}
.tscr a{font-family:var(--mono);font-size:12px;color:var(--cyan);text-decoration:none;padding-top:3px}
.tscr mark{background:color-mix(in srgb,var(--gold) 35%,transparent);color:inherit;border-radius:3px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tblw{overflow-x:auto}
.tbl th{text-align:left;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl a{color:var(--cyan);text-decoration:none}
.toolchips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.toolchips a{padding:5px 11px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:13.5px}
.toolchips a:hover{border-color:var(--cyan);color:var(--cyan)}
.chap{display:grid;gap:4px;margin:6px 0}
.chap a{display:grid;grid-template-columns:62px 1fr;gap:12px;text-decoration:none;padding:4px 0}
.chap a span:first-child{font-family:var(--mono);font-size:12px;color:var(--cyan);padding-top:2px}
.chap a:hover span:last-child{color:var(--cyan)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6;color:color-mix(in srgb,var(--ink) 85%,var(--mute));max-width:78ch}
.note{width:100%;min-height:140px;resize:vertical;line-height:1.5}
.nodata{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--mute);display:grid;gap:10px;justify-items:start}
.msg{font-size:13px;color:var(--mute)}

/* Sıra çekmecesi */
.drawer{margin:0 0 0 auto;height:100dvh;max-height:100dvh;width:min(420px,100%);border-radius:0;border-width:0 0 0 1px;display:none;flex-direction:column}
.drawer[open]{display:flex;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.drh{padding:calc(18px + env(safe-area-inset-top,0px)) 20px 12px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.drh h2{margin:0;font-size:22px}
.drh small{font-family:var(--mono);color:var(--mute);font-size:12px}
.qlist{list-style:none;margin:0;padding:10px 12px;overflow:auto;flex:1;display:grid;gap:8px;align-content:start}
.qlist li{display:grid;grid-template-columns:22px 96px 1fr auto;gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.qlist .n{font-family:var(--mono);font-size:12px;color:var(--gold);text-align:center}
.qlist img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:7px;display:block;background:var(--chip)}
.qlist .qt{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qlist .qm{font-family:var(--mono);font-size:11px;color:var(--mute)}
.qlist .qa{display:flex;flex-direction:column;gap:2px}
.qlist .qa button{font:inherit;font-size:12px;width:26px;height:22px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer;padding:0}
.qlist .qa button:hover{border-color:var(--cyan);color:var(--cyan)}
.drf{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--mute)}
.hint{margin:10px 0 0;font-size:12.5px;color:var(--mute)}

@media (max-width:760px){
  .hin{padding:80px 16px 24px}
  .hero::before{background:linear-gradient(0deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 85%,transparent) 35%,color-mix(in srgb,var(--bg) 25%,transparent) 70%,color-mix(in srgb,var(--bg) 60%,transparent) 100%)}
  .wrap{padding:0 16px 90px}.topbar{padding-inline:16px}
  .card.open{flex-direction:column}
  .card.open .ph{flex:none;aspect-ratio:16/9}
  .card.open .ph::after{background:linear-gradient(0deg,var(--solid),transparent 50%)}
  .xp{padding:4px 14px 14px}
}
@media (max-width:560px){ol.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.body{padding:8px 9px 10px}.d{display:none}.shown{margin-left:0;width:100%}.boards{grid-template-columns:repeat(2,minmax(0,1fr))}.tb-acts .btn span{display:none}.qlist li{grid-template-columns:18px 80px 1fr auto}.qlist img{width:80px}.dbody{padding:16px}.kv{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

let lastRows=[];
function rows(){
  const q=low($("q").value.trim()),s=$("sort").value,wt=$("watch").value;
  let r=boardRows(board).filter(p=>{
    if(wt==="done"&&!isRead(p))return false;if(wt==="none"&&isRead(p))return false;
    if(F.has("fav")&&!isFav(p))return false;if(F.has("sira")&&qPos(p)<0)return false;
    if(F.has("src")&&!p.link)return false;if(F.has("det")&&!p.sm)return false;if(F.has("titled")&&!p.t)return false;
    if(q&&!low(p.t+" "+p.sm+" "+p.ch+" "+p.alt+" "+(SRCIDX[p.id]||"")).includes(q))return false;return true});
  if(!board&&s==="list")r.sort((a,b)=>a.n-b.n);
  if(s==="new")r.sort((a,b)=>b.dt.localeCompare(a.dt));
  if(s==="old")r.sort((a,b)=>a.dt.localeCompare(b.dt));
  if(s==="title")r.sort((a,b)=>(!a.t)-(!b.t)||a.t.localeCompare(b.t,"tr"));
  if(s==="ch")r.sort((a,b)=>(!a.ch)-(!b.ch)||a.ch.localeCompare(b.ch,"tr"));

      ${p.link?`<a class="u" href="${esc(k.son_url||p.link)}" target="_blank" rel="noopener">${esc(k.son_url||p.link)} ↗</a>`:""}</div><p class="msg" style="margin-top:12px">Kaynak sayfa bilgisi ${META.tarih} tarihinde sayfanın başlık ve açıklama etiketlerinden okundu.</p>`}
  if(dmTab==="not"){box.innerHTML=`<h4>Kişisel not</h4><textarea class="note" id="note" placeholder="Bu tasarımda neyi beğendin, hangi projede kullanacaksın…">${esc(S.not[dmId]||"")}</textarea><p class="msg" id="noteS">Yazdıkça kaydedilir.</p>`;
    let nt=0;$("note").addEventListener("input",e=>{clearTimeout(nt);$("noteS").textContent="Yazılıyor…";nt=setTimeout(()=>{const v=e.target.value.trim();if(v)S.not[dmId]=v;else delete S.not[dmId];save("not");$("noteS").textContent="Kaydedildi."},700)})}}
$("dm").addEventListener("close",()=>{dmId=null;render()});$("dm").addEventListener("click",e=>{if(e.target===$("dm"))$("dm").close()});

/* ---------- CSV ---------- */
(async()=>{const dl=window.claude&&claude.use?await claude.use("downloads"):null;if(!dl)return;$("csv").hidden=false;
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  $("csv").addEventListener("click",async()=>{const lines=[["Pano","Pin linki","Başlık","Site","Kaynak link","Kaydedildi","Favori","Sıra","İncelendi","Not","Değişiklik"].map(q).join(",")];
    R.flatMap(p=>bOf(p).map(b=>[b,p])).sort((a,b)=>a[0].localeCompare(b[0],"tr")).forEach(([b,p])=>lines.push([b,pinU(p.id),ttl(p),p.ch,p.link,fdt(p.dt),isFav(p)?"evet":"",qPos(p)>=0?qPos(p)+1:"",isRead(p)?"evet":"",S.not[p.id]||"",p.base.includes(b)?"":"eklenecek"].map(q).join(",")));
    R.forEach(p=>p.base.filter(b=>!lists(p).includes(b)).forEach(b=>lines.push([b,pinU(p.id),ttl(p),p.ch,p.link,fdt(p.dt),"","","","","çıkarılacak"].map(q).join(","))));
    try{await dl.save({filename:"pinterest-panolar.csv",data:"﻿"+lines.join("\r\n")})}catch(e){if(e&&e.code==="unavailable")$("csv").hidden=true}})})();
