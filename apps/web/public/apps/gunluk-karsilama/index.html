  <!-- Astra: varsayılan koyu tema. Eski kayıtlardaki açık tema bir kez koyuya
       çevrilir; sonradan açık tema seçilirse o seçim korunur. -->
  <script>
    try{
      if(!localStorage.getItem('astra-karsilama-koyu-v1')){
        var p = JSON.parse(localStorage.getItem('astra_prefs') || 'null');
        if(p && p.theme !== 'dark'){ p.theme = 'dark'; localStorage.setItem('astra_prefs', JSON.stringify(p)); }
        localStorage.setItem('astra-karsilama-koyu-v1', '1');
      }
    }catch(e){}
  </script>
